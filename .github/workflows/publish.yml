name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test tests/AspNet.MasterPass.Tests/AspNet.MasterPass.Tests.csproj -c Release --no-restore

      - name: Pack
        run: >
          dotnet pack src/AspNet.MasterPass/AspNet.MasterPass.csproj
          -c Release --no-restore -o artifacts
          -p:Version=${GITHUB_REF_NAME#v}

      # Exchanges the GitHub OIDC token for a short-lived NuGet API key (valid for 1 hour,
      # single use). There is no long-lived key to store.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The .snupkg symbol package in the same folder is pushed along with the .nupkg.